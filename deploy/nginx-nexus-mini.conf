# nexus-mini — нэг домэйн: /api/* → Go (8084), бусад нь Next.js (3020)
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name nexus-mini.runestonetechnologies.com;
	include snippets/deny-dotfiles.conf;
	include snippets/ssl-runestone.conf;
	include snippets/security-headers.conf;

	# Платформын админ API зөвхөн админ домэйноос (#6)
	location ^~ /api/admin/ {
		return 404;
	}
	location /api/ {
		include snippets/proxy.conf;
		proxy_pass http://127.0.0.1:8084;
	}
	location = /health {
		include snippets/proxy.conf;
		proxy_pass http://127.0.0.1:8084;
	}
	location / {
		include snippets/proxy.conf;
		proxy_pass http://127.0.0.1:3020;
	}
}

# Платформын админ — тусдаа код, тусдаа домэйн
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name nexus-mini-admin.runestonetechnologies.com;
	include snippets/deny-dotfiles.conf;
	include snippets/ssl-runestone.conf;
	include snippets/security-headers.conf;

	location /api/ {
		include snippets/proxy.conf;
		proxy_pass http://127.0.0.1:8084;
	}
	location / {
		include snippets/proxy.conf;
		proxy_pass http://127.0.0.1:3021;
	}
}
