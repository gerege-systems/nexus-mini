# nexus-mini — nginx дээж. Хуулж аваад домэйн, сертийн зам, snippet-үүдээ
# өөрийнхөөрөө тохируулна. Бодит домэйн/зам энэ репод бичигдэхгүй.
#
# Бүтэц: нэг домэйн дээр portal (`/api/*` → Go, бусад → Next :3020),
# өөр домэйн дээр платформын админ (Next :3021, мөн `/api/*` → Go).
# API-г ТУСДАА домэйн болговол сессийн cookie (host-only) явахгүй, цөмийн
# `sameOriginOnly` шалгалт 403 өгнө — тиймээс энэ бүтцийг задлахгүй.
#
# ⚠ TLS: wildcard сертификат НЭГ л шат таардаг. `*.example.com` нь
# `admin.portal.example.com` шиг ХОЁР шаттай нэрийг хамрахгүй тул тийм нэрийг
# сертийн SAN-д тусад нь нэмнэ (`certbot --expand -d …`). `deploy/check-tls.sh`
# үүнийг deploy бүрт шалгана.
#
# nginx.conf-ийн http блокт (WebSocket upgrade-д) хэрэгтэй:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ── Дундын хэсгүүд: өөрийн snippets/-т зөөвөл илүү цэвэр ────────────────────
# proxy тохиргоо (доорх location бүрд давтагдана):
#   proxy_http_version 1.1;
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header Upgrade $http_upgrade;
#   proxy_set_header Connection $connection_upgrade;
# Цөм rate limit-дээ `X-Real-IP`-г ашигладаг тул түүнийг зөвхөн энэ proxy
# тавьдаг байх ёстой (гаднаас ирсэн утгад итгэхгүй).

server {
	listen 80;
	listen [::]:80;
	server_name portal.example.com admin.portal.example.com;

	location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
	location / { return 301 https://$host$request_uri; }
}

# ── Portal + API ────────────────────────────────────────────────────────────
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name portal.example.com;

	ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	# Content-Security-Policy-г апп өөрөө тавина (nonce хүсэлт бүрт өөр).

	# Нуугдмал файл (.git, .env …) — ACME-аас бусад нь хаалттай
	location ~ /\.(?!well-known) {
		access_log off;
		log_not_found off;
		return 444;
	}

	# Платформын админ API зөвхөн админ домэйноос (#6)
	location ^~ /api/admin/ {
		return 404;
	}
	location /api/ {
		include snippets/nexus-proxy.conf;  # deploy/nginx-proxy.conf-оос хуулна
		proxy_pass http://127.0.0.1:8084;
	}
	location = /health {
		include snippets/nexus-proxy.conf;  # deploy/nginx-proxy.conf-оос хуулна
		proxy_pass http://127.0.0.1:8084;
	}
	location / {
		include snippets/nexus-proxy.conf;  # deploy/nginx-proxy.conf-оос хуулна
		# Апп server action ашигладаггүй. Сканнерууд хог `Next-Action`
		# толгойтой POST илгээж Next-ийн лог руу алдаа бичүүлдэг — толгойг
		# нь эх үүсвэрт нь таслана.
		proxy_set_header Next-Action "";
		proxy_pass http://127.0.0.1:3020;
	}
}

# ── Платформын админ — тусдаа код, тусдаа домэйн ────────────────────────────
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name admin.portal.example.com;

	ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	location ~ /\.(?!well-known) {
		access_log off;
		log_not_found off;
		return 444;
	}

	location /api/ {
		include snippets/nexus-proxy.conf;  # deploy/nginx-proxy.conf-оос хуулна
		proxy_pass http://127.0.0.1:8084;
	}
	location / {
		include snippets/nexus-proxy.conf;  # deploy/nginx-proxy.conf-оос хуулна
		proxy_set_header Next-Action "";
		proxy_pass http://127.0.0.1:3021;
	}
}
